name: Feature Pipeline

on:
  push:
    branches:
      - "feature/**"

jobs:
  feature-ci:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install Gitleaks CLI
      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      # Run Secret Scan
      - name: Run Gitleaks Scan
        run: |
          gitleaks detect --source . --verbose

      # Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # Run automated tests
      - name: Run Tests
        run: npm test

      # Install NoVuln CLI
      - name: Install NoVuln
        run: npm install -g novuln-backend

      # Run SAST Scan
      - name: Run NoVuln Scan
        run: novuln scan . --ci

      # Upload scan reports
      - name: Upload NoVuln Reports
        uses: actions/upload-artifact@v4
        with:
          name: novuln-security-report
          path: |
            report.json
            summary.json